  // 各分頁專屬極簡操作說明（點導覽列 ? 圖示顯示）

        '<strong>推播排程與 LIFF 參數</strong>：檢視每月 Push 額度、啟用每小時自動掃描排程與設定 LIFF 網址。',
        '<strong>官方簡章匯入</strong>：上傳 PDF 或截圖讓 Gemini 自動解析班隊與考試日期，供登記頁與手動提醒快速帶入。',
        '<strong>健檢與連線診斷</strong>：檢查全站官網網址有效性與 LINE Webhook 連線狀態。'
      ]
    }
  };

  const state = {
    token: '',
    role: 'staff',
    ownerProfile: 'VETERAN_EMP',
    hasGeminiKey: false,
    activeGeminiModel: '',
    hasTelegramConfig: false,
    hasGithubConfig: false,
    githubRepo: '',
    defaultAiSystemContext: '',
    settings: {},
    holidays: [],
    categories: [],
    faqs: [],
    healthReport: [],
    groupAssignments: [],
    groupDrafts: [],
    // 定時提醒、官方期程、手動提醒排程與手動名單來源
    reminderLoaded: false,
    manualLoaded: false,
    reminderTemplates: [],
    businessTypes: [],
    reminderOfficialSchedules: [],
    reminderRecords: [],
    manualReminders: [],
    manualSourceRows: [],
    mcDraftStages: [],
    mcPreviewTimer: null,
    mcPreviewSeq: 0,
    reminderPushStats: { yearMonth: '', used: 0, limit: 200, remain: 200, percent: 0 },
    reminderTriggerInstalled: false,
    reminderLiffUrl: '',
    reminderLiffChannelIdSet: false,
    reminderOaChatUrl: 'https://chat.line.biz/',
    schDocBase64: '',
    schDocMimeType: '',
    schParsedItems: [],
    activeTab: 'daytime',
    settingsSubTab: 'sys',
    dayCat: 'MY_SCOPE',
    dayOnlyPinned: false,
    dayExpandAll: false,
    pinnedKeys: new Set(),
    lastFocusedTextarea: null,
    pendingMediaMode: 'image',
    pendingSlotIdx: null,
    pendingAiSlotIdx: null,
    batchAudioB64: '',
    batchAudioMime: 'audio/mp4',
    batchItems: [],
    draftTimer: null
  };

  // ==========================================
  // 業務分工判斷與連動篩選
  // ==========================================
  function loadSavedOwnerProfile() {
    try {
      const saved = localStorage.getItem(STORAGE_OWNER_KEY);
      if (saved && OWNER_PROFILES[saved]) return saved;
    } catch (e) {}
    return 'VETERAN_EMP';
  }

  function saveOwnerProfile(profileKey) {
    const key = OWNER_PROFILES[profileKey] ? profileKey : 'ALL';
    state.ownerProfile = key;
    try { localStorage.setItem(STORAGE_OWNER_KEY, key); } catch (e) {}
    const loginSel = document.getElementById('loginOwnerProfile');
    const topSel = document.getElementById('topOwnerSelect');
    if (loginSel) loginSel.value = key;
    if (topSel) topSel.value = key;
  }

  function getActiveOwnerCfg() {
    return OWNER_PROFILES[state.ownerProfile] || OWNER_PROFILES.ALL;
  }

  function isCpasFaqItem(item) {
    const kw = String((item && item.keywords) || '').toLowerCase();
    const m1 = String((item && item.msgs && item.msgs[0]) || '').toLowerCase();
    return (kw.indexOf('適性評量') !== -1 || kw.indexOf('cpass') !== -1 || kw.indexOf('cpas') !== -1 || m1.indexOf('cpass-application') !== -1);
  }

  function matchesOwnerFaq(item) {
    const pk = state.ownerProfile;
    if (pk === 'ALL') return true;
    const cfg = getActiveOwnerCfg();
    if (cfg.faqCats && cfg.faqCats.indexOf(item.category) === -1) return false;
    if (pk === 'VETERAN_EMP' && item.category === '就業服務' && isCpasFaqItem(item)) return false;
    return true;
  }

  function matchesOwnerApplyType(applyType, liffGroup) {
    const pk = state.ownerProfile;
    if (pk === 'ALL') return true;
    const grp = String(liffGroup || '').trim();
    if (grp) return matchesOwnerLiffGroup(grp);

    const tp = String(applyType || '');
    if (pk === 'VETERAN_EMP') {
      return tp.indexOf('榮民就業') !== -1 || tp.indexOf('訓後就業') !== -1;
    }
    if (pk === 'CLASS2_CPAS') {
      return tp.indexOf('二類就業') !== -1 || tp.indexOf('適性評量') !== -1 || tp.indexOf('CPAS') !== -1;
    }
    if (pk === 'TRAIN_EDU_EXAM') {
      if (tp === '訓後就業') return false;
      return tp.indexOf('職訓') !== -1 || tp.indexOf('就學') !== -1 || tp.indexOf('進修') !== -1 || tp.indexOf('考試') !== -1;
    }
    return true;
  }

  function matchesOwnerLiffGroup(liffGroup) {
    const pk = state.ownerProfile;
    if (pk === 'ALL') return true;
    const cfg = getActiveOwnerCfg();
    return cfg.liffGroups.indexOf(String(liffGroup || '').trim()) !== -1;
  }

  function matchesOwnerDraft(draft) {
    const pk = state.ownerProfile;
    if (pk === 'ALL') return true;
    const cfg = getActiveOwnerCfg();
    const rec = String((draft && draft.recipients) || '');
    const src = String((draft && draft.draftSource) || '');

    if (cfg.draftTag && rec.indexOf(cfg.draftTag) !== -1) return true;
    if (rec.indexOf('共通') !== -1) return true;
    if (rec.indexOf('榮民就業＆訓後就業') !== -1 || rec.indexOf('二類就業＆CPAS') !== -1 || rec.indexOf('職訓、就學進修＆考試') !== -1) {
      return false;
    }

    const text = (src + ' ' + String((draft && draft.maskedQuestion) || '')).toLowerCase();
    if (pk === 'TRAIN_EDU_EXAM') return /職訓|就學|進修|考試|補習|學分班|備案/.test(text);
    if (pk === 'CLASS2_CPAS') return /二類|cpas|cpass|適性評量/.test(text);
    if (pk === 'VETERAN_EMP') return /就業|津貼|介紹卡|訓後|求職/.test(text) && !/二類|cpas|適性評量/.test(text);
    return true;
  }

  function syncScopeSelectorsToOwner() {
    const isAll = state.ownerProfile === 'ALL';
    const defVal = isAll ? 'ALL' : 'MY_SCOPE';
    state.dayCat = defVal;

    ['manualScopeFilter', 'draftScopeFilter', 'remTplGroupFilter', 'remRecScopeFilter', 'mcSourceFilter'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.value = defVal;
    });

    const mgrSel = document.getElementById('mgrCatSelect');
    if (mgrSel && mgrSel.options.length > 0) {
      mgrSel.value = defVal;
    }
  }

  function onOwnerProfileChanged(newKey) {
    saveOwnerProfile(newKey);
    syncScopeSelectorsToOwner();

    renderDayCatPills();
    renderDaytimeList();
    renderManualReminders();
    renderDraftBoardList();
    renderManageSelectors();
    renderManageList();
    if (state.reminderLoaded) {
      renderReminderTypeFilter();
      renderReminderTemplates();
      renderReminderRecords();
    }
    showToast('已切換業務視角：' + getActiveOwnerCfg().label, 'ok');
  }

  // ==========================================
  // ? 情境說明視窗（依目前所在分頁顯示精簡說明）
  // ==========================================
  function openHelpModal() {
    const info = TAB_HELP_CONTENT[state.activeTab] || TAB_HELP_CONTENT.daytime;
    document.getElementById('helpModalTitle').textContent = info.title;
    document.getElementById('helpModalBody').innerHTML =
      '<ol class="help-list">' +
        info.items.map(function (line) { return '<li>' + line + '</li>'; }).join('') +
      '</ol>';
    document.getElementById('helpModal').classList.remove('hidden');
  }

  // ==========================================
  // 初始化與登入管理
  // ==========================================
  window.addEventListener('DOMContentLoaded', function () {
    initEmojiBars();
    loadPinnedKeys();
    saveOwnerProfile(loadSavedOwnerProfile());
    buildMcSemesterOptions();

    document.getElementById('passcodeInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });

    document.getElementById('hiddenImgInput').addEventListener('change', handleImageFilePicked);
    document.getElementById('hiddenAudioInput').addEventListener('change', handleAudioFilePicked);
    document.getElementById('hiddenAiAudioInput').addEventListener('change', handleAiAudioFilePicked);
    document.getElementById('hiddenIcsInput').addEventListener('change', handleIcsFilePicked);
    document.getElementById('hiddenScheduleDocInput').addEventListener('change', handleScheduleDocFilePicked);

    tryAutoLogin();
  });

  function initEmojiBars() {
    const dayWrap = document.getElementById('dayEmojiBtns');
    const modalWrap = document.getElementById('modalEmojiBtns');
    dayWrap.innerHTML = '';
    modalWrap.innerHTML = '';
    PUBLIC_EMOJIS.forEach(function (em) {
      const b1 = document.createElement('button');
      b1.type = 'button';
      b1.className = 'emoji-btn';
      b1.textContent = em;
      b1.onclick = function () { insertEmojiToFocused(em); };
      dayWrap.appendChild(b1);

      const b2 = document.createElement('button');
      b2.type = 'button';
      b2.className = 'emoji-btn';
      b2.textContent = em;
      b2.onclick = function () { insertEmojiToFocused(em); };
      modalWrap.appendChild(b2);
    });
  }

  function toggleEmojiBar(wrapId, btnEl) {
    const wrap = document.getElementById(wrapId);
    if (!wrap) return;
    const isNowHidden = wrap.classList.toggle('hidden');
    if (btnEl) {
      btnEl.classList.toggle('btn-soft', !isNowHidden);
      btnEl.textContent = isNowHidden ? '插入符號' : '收合符號';
    }
  }

  function insertEmojiToFocused(emoji) {
    const el = state.lastFocusedTextarea;
    if (!el || !document.body.contains(el)) {
      copyTextValue(emoji, '已複製符號 ' + emoji + '（先點選文字框可直接插入游標處）');
      return;
    }
    const start = el.selectionStart || 0;
    const end = el.selectionEnd || 0;
    const val = el.value || '';
    el.value = val.slice(0, start) + emoji + val.slice(end);
    el.focus();
    el.selectionStart = el.selectionEnd = start + emoji.length;
    el.dispatchEvent(new Event('input'));
  }

  function loadPinnedKeys() {
    try {
      const raw = localStorage.getItem(STORAGE_PIN_KEY);
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) state.pinnedKeys = new Set(arr);
      }
    } catch (e) {}
  }

  function savePinnedKeys() {
    try {
      localStorage.setItem(STORAGE_PIN_KEY, JSON.stringify(Array.from(state.pinnedKeys)));
    } catch (e) {}
  }

  function tryAutoLogin() {
    let saved = null;
    try {
      const raw = localStorage.getItem(STORAGE_AUTH_KEY);
      if (raw) saved = JSON.parse(raw);
    } catch (e) {}

    if (saved && saved.token && saved.expiresAt > Date.now()) {
      if (saved.ownerProfile && OWNER_PROFILES[saved.ownerProfile]) {
        saveOwnerProfile(saved.ownerProfile);
      }
      setLoading(true, '正在驗證登入狀態...');
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) {
            state.token = saved.token;
            state.role = res.role || saved.role || 'staff';
            enterApp();
          } else {
            clearSavedAuth();
            setLoading(false);
          }
        })
        .withFailureHandler(function () { setLoading(false); })
        .apiVerifySession(saved.token);
    }
  }

  function doLogin() {
    const pwd = (document.getElementById('passcodeInput').value || '').trim();
    const chosenOwner = document.getElementById('loginOwnerProfile').value || 'ALL';
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    if (!pwd) { errEl.textContent = '請輸入密碼'; return; }

    saveOwnerProfile(chosenOwner);
    setLoading(true, '驗證密碼中...');
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.ok) {
          state.token = res.token;
          state.role = res.role;
          if (document.getElementById('rememberLogin').checked) {
            try {
              localStorage.setItem(STORAGE_AUTH_KEY, JSON.stringify({
                token: res.token,
                role: res.role,
                ownerProfile: chosenOwner,
                expiresAt: Date.now() + AUTH_TTL_MS
              }));
            } catch (e) {}
          }
          document.getElementById('passcodeInput').value = '';
          enterApp();
        } else {
          setLoading(false);
          errEl.textContent = (res && res.message) || '密碼錯誤，請再試一次。';
        }
      })
      .withFailureHandler(function (err) {
        setLoading(false);
        errEl.textContent = '連線異常：' + (err.message || err);
      })
      .apiLogin(pwd);
  }

  function doLogout(expired) {
    stopDraftAutoRefresh();
    clearSavedAuth();
    state.token = '';
    state.reminderLoaded = false;
    state.manualLoaded = false;
    document.getElementById('appView').classList.add('hidden');
    document.getElementById('loginView').classList.remove('hidden');
    if (expired) {
      document.getElementById('loginError').textContent = '登入憑證已逾期，請重新登入。';
    }
  }

  function clearSavedAuth() {
    try { localStorage.removeItem(STORAGE_AUTH_KEY); } catch (e) {}
  }

  function enterApp() {
    const isAdmin = state.role === 'admin';
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('appView').classList.remove('hidden');
    document.getElementById('roleBadge').textContent = isAdmin ? '管理者' : '同仁';

    document.getElementById('navSettingsBtn').classList.toggle('hidden', !isAdmin);
    document.getElementById('clearDraftsBtn').classList.toggle('hidden', !isAdmin);

    document.getElementById('topOwnerSelect').value = state.ownerProfile;
    syncScopeSelectorsToOwner();

    switchTab('daytime');
    loadAllData(false);
  }

  function loadAllData(showToastMsg) {
    setLoading(true, '載入資料中...');
    google.script.run
      .withSuccessHandler(function (res) {
        setLoading(false);
        if (!res || res.authError) { doLogout(true); return; }
        state.role = res.role;
        state.hasGeminiKey = !!res.hasGeminiKey;
        state.activeGeminiModel = res.activeGeminiModel || '';
        state.hasTelegramConfig = !!res.hasTelegramConfig;
        state.hasGithubConfig = !!res.hasGithubConfig;
        state.githubRepo = res.githubRepo || '';
        state.defaultAiSystemContext = res.defaultAiSystemContext || '';
        state.settings = res.settings || {};
        state.holidays = res.holidays || [];
        state.categories = res.categories || [];
        state.faqs = res.faqs || [];
        state.healthReport = res.healthReport || [];
        state.groupAssignments = res.groupAssignments || [];
        state.groupDrafts = res.groupDrafts || [];
        if (state.settings.oaChatUrl) state.reminderOaChatUrl = state.settings.oaChatUrl;

        state.reminderLiffUrl = String(state.settings.liffUrl || '').trim();
        document.getElementById('remLiffUrlDisplay').value = state.reminderLiffUrl;

        refreshAllViews();
        refreshManualRemindersUI(false);

        if (state.activeTab === 'reminder' || state.reminderLoaded) {
          loadReminderData(false);
        }
        if (showToastMsg) showToast('資料已更新', 'ok');
      })
      .withFailureHandler(function (err) {
        setLoading(false);
        showToast('同步失敗：' + (err.message || err), 'err');
      })
      .apiGetAllData(state.token);
  }

  function canEditNow() {
    if (state.role === 'admin') return true;
    return String(state.settings.allowStaffEdit).toLowerCase() !== 'false';
  }

  function switchTab(tabName) {
    if (tabName === 'settings' && state.role !== 'admin') return;
    state.activeTab = tabName;
    document.querySelectorAll('.nav-btn[data-tab]').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-tab') === tabName);
    });
    document.querySelectorAll('.tab-section').forEach(function (sec) {
      sec.classList.add('hidden');
    });
    const target = document.getElementById('tab-' + tabName);
    if (target) target.classList.remove('hidden');

    if (tabName === 'assist') renderAssistTab();
    if (tabName === 'reminder') loadReminderData(false);
    if (tabName === 'settings') switchSettingsSubTab(state.settingsSubTab || 'sys');
  }

  function switchSettingsSubTab(subName) {
    if (state.role !== 'admin') return;
    state.settingsSubTab = subName;

    ['sys', 'rem', 'sch', 'tg', 'health'].forEach(function (k) {
      const btn = document.getElementById('subBtn-' + k);
      const sec = document.getElementById('subtab-' + k);
      if (btn) btn.classList.toggle('active', k === subName);
      if (sec) sec.classList.toggle('hidden', k !== subName);
    });

    if (subName === 'sys') renderSettingsView();
    if (subName === 'rem' || subName === 'sch') {
      if (!state.reminderLoaded) loadReminderData(false);
      else {
        renderReminderDashboard();
        renderOfficialSchedulesTable();
      }
    }
    if (subName === 'tg') renderAssistTab();

  // ==========================================
  // 工具函式
  // ==========================================
  function isFlexTag(str) { return String(str || '').trim() === FLEX_TAG_TRAINING_CALC; }

  function isAudioUrl(str) {
    const s = String(str || '').trim();
    if (!/^https:\/\//i.test(s) || /\s/.test(s)) return false;
    return /\.m4a(\?[^#]*)?(#.*)?$/i.test(s);
  }

  function isImageUrl(str) {
    const s = String(str || '').trim();
    if (!/^https:\/\//i.test(s) || /\s/.test(s)) return false;
    if (isAudioUrl(s)) return false;
    if (/lh3\.googleusercontent\.com\/d\//i.test(s)) return true;
    return /\.(jpg|jpeg|png|gif|webp)(\?[^#]*)?(#.*)?$/i.test(s);
  }

  function stripHash(url) { return String(url || '').trim().replace(/#.*$/, ''); }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function getFaqKey(item) { return item.category + '::' + item.rowIndex; }

  function setLoading(show, text) {
    document.getElementById('loadingText').textContent = text || '處理中，請稍候...';
    document.getElementById('loadingMask').classList.toggle('hidden', !show);
  }

  function showToast(msg, type) {
    const box = document.getElementById('toastBox');
    const div = document.createElement('div');
    div.className = 'toast ' + (type || '');
    div.textContent = msg;
    box.appendChild(div);
    setTimeout(function () {
      div.style.opacity = '0';
      setTimeout(function () { if (div.parentNode) div.parentNode.removeChild(div); }, 250);
    }, 3000);
  }

  function copyTextValue(text, successMsg) {
    const val = String(text || '');
    if (!val) { showToast('內容為空，無法複製', 'err'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(val).then(function () {
        showToast(successMsg || '已複製', 'ok');
      }).catch(function () { fallbackCopyText(val, successMsg); });
    } else {
      fallbackCopyText(val, successMsg);
    }
  }

  function fallbackCopyText(val, successMsg) {
    const ta = document.createElement('textarea');
    ta.value = val;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast(successMsg || '已複製', 'ok');
    } catch (e) {
      showToast('請手動全選複製', 'err');
    }
    document.body.removeChild(ta);
  }

  function copyImageFromUrl(url) {
    const clean = stripHash(url);
    setLoading(true, '讀取圖片中...');
    google.script.run
      .withSuccessHandler(function (res) {
        setLoading(false);
        if (!res || !res.ok || !res.dataUrl) {
          showToast('讀取失敗，請點圖片開新分頁另存', 'err');
          return;
        }
        convertDataUrlToPngBlob(res.dataUrl, function (pngBlob) {
          if (pngBlob && navigator.clipboard && window.ClipboardItem) {
            navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob })])
              .then(function () { showToast('已複製圖片，可直接貼回 LINE', 'ok'); })
              .catch(function () { copyTextValue(clean, '已改複製圖片網址'); });
          } else {
            copyTextValue(clean, '已改複製圖片網址');
          }
        });
      })
      .withFailureHandler(function (err) {
        setLoading(false);
        showToast('圖片讀取失敗：' + (err.message || err), 'err');
      })
      .apiGetImageBase64(state.token, clean);
  }

  function convertDataUrlToPngBlob(dataUrl, cb) {
    const img = new Image();
    img.onload = function () {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth || img.width;
      c.height = img.naturalHeight || img.height;
      c.getContext('2d').drawImage(img, 0, 0);
      c.toBlob(function (blob) { cb(blob); }, 'image/png');
    };
    img.onerror = function () { cb(null); };
    img.src = dataUrl;
  }

  function renderManualReminders() {
    const ownerBadge = document.getElementById('dayManualOwnerBadge');
    const dueBadge = document.getElementById('dayManualDueBadge');
    if (ownerBadge) ownerBadge.textContent = getActiveOwnerCfg().label;

    const scopeFilter = document.getElementById('manualScopeFilter').value || 'MY_SCOPE';
    const dueFilter = document.getElementById('manualDueFilter').value || 'PENDING';
    const q = (document.getElementById('manualSearchInput').value || '').trim().toLowerCase();
    const wrap = document.getElementById('manualReminderList');
    wrap.innerHTML = '';

    const scopedAll = (state.manualReminders || []).filter(function (it) {
      if (scopeFilter === 'MY_SCOPE') return matchesOwnerApplyType(it.applyType, it.liffGroup);
      if (scopeFilter !== 'ALL') return it.liffGroup === scopeFilter;
      return true;
    });

    const totalPending = scopedAll.filter(function (x) { return x.status === '待提醒'; }).length;
    const dueSoonCnt = scopedAll.filter(function (x) { return x.status === '待提醒' && x.diffDays <= 7; }).length;
    const dueNowCnt = scopedAll.filter(function (x) { return x.status === '待提醒' && x.diffDays <= 0; }).length;

    if (dueBadge) {
      if (!state.manualLoaded) {
        dueBadge.className = 'badge badge-dark';
        dueBadge.textContent = '載入中...';
      } else if (dueNowCnt > 0) {
        dueBadge.className = 'badge badge-err';
        dueBadge.textContent = '今日到期 ' + dueNowCnt + ' 筆（待提醒 ' + totalPending + '）';
      } else if (dueSoonCnt > 0) {
        dueBadge.className = 'badge badge-warn';
        dueBadge.textContent = '7 天內到期 ' + dueSoonCnt + ' 筆（待提醒 ' + totalPending + '）';
      } else if (totalPending > 0) {
        dueBadge.className = 'badge badge-cyan';
        dueBadge.textContent = '待提醒 ' + totalPending + ' 筆';
      } else {
        dueBadge.className = 'badge badge-on';
        dueBadge.textContent = '尚無待提醒';
      }
    }

    const list = scopedAll.filter(function (it) {
      if (dueFilter === 'PENDING' && it.status !== '待提醒') return false;
      if (dueFilter === 'DUE_SOON' && (it.status !== '待提醒' || it.diffDays > 7)) return false;
      if (q) {
        const hay = (it.applicantName + ' ' + it.applyType + ' ' + it.caseNote + ' ' + it.stageName + ' ' + it.remindDate + ' ' + it.copyText).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    document.getElementById('manualCountLabel').textContent = '顯示 ' + list.length + ' 筆（可切換「全部業務」查其他承辦排程）';

    if (!list.length) {
      wrap.innerHTML = '<div style="text-align:center;padding:24px 12px;color:var(--muted);">目前尚無手動提醒項目。<br>請點右上角「新增手動提醒」手動建檔或從「手動名單_*」帶入補填。</div>';
      return;
    }

    list.forEach(function (it) {
      const isPending = it.status === '待提醒';
      const isDueNow = isPending && it.diffDays <= 0;
      const card = document.createElement('div');
      card.className = 'faq-card ' + (!isPending ? 'is-off' : (isDueNow ? 'is-manual-due' : 'is-manual'));

      let timingBadge = '';
      if (it.status === '已傳送') {
        timingBadge = '<span class="badge badge-on">已傳送（' + escapeHtml(it.remindDate) + '）</span>';
      } else if (it.status === '已取消') {
        timingBadge = '<span class="badge badge-off">已取消（' + escapeHtml(it.remindDate) + '）</span>';
      } else if (it.diffDays < 0) {
        timingBadge = '<span class="badge badge-err">已到期 ' + Math.abs(it.diffDays) + ' 天（' + escapeHtml(it.remindDate) + '）</span>';
      } else if (it.diffDays === 0) {
        timingBadge = '<span class="badge badge-err">今日到期（' + escapeHtml(it.remindDate) + '）</span>';
      } else if (it.diffDays <= 7) {
        timingBadge = '<span class="badge badge-warn">' + it.diffDays + ' 天後（' + escapeHtml(it.remindDate) + '）</span>';
      } else {
        timingBadge = '<span class="badge badge-dark">' + escapeHtml(it.remindDate) + '（' + it.diffDays + ' 天後）</span>';
      }

      const head = document.createElement('div');
      head.className = 'faq-head';
      head.innerHTML =
        '<div class="faq-head-left">' +
          timingBadge +
          '<span class="badge badge-cat">' + escapeHtml(it.applyType) + '</span>' +
          '<strong style="font-size:14.5px;color:var(--charcoal);">' + escapeHtml(it.applicantName) + '</strong>' +
          (it.caseNote ? ('<span style="font-size:12.5px;color:var(--muted);">（' + escapeHtml(it.caseNote) + '）</span>') : '') +
        '</div>';

      const ops = document.createElement('div');
      ops.className = 'toolbar-group';

      const copyMsgBtn = document.createElement('button');
      copyMsgBtn.type = 'button';
      copyMsgBtn.className = 'btn btn-primary btn-xs';
      copyMsgBtn.textContent = '複製訊息';
      ops.appendChild(copyMsgBtn);

      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'btn btn-xs';
      editBtn.textContent = '編輯';
      editBtn.onclick = function () { openManualEditModal(it); };
      ops.appendChild(editBtn);

      if (isPending) {
        const doneBtn = document.createElement('button');
        doneBtn.type = 'button';
        doneBtn.className = 'btn btn-soft btn-xs';
        doneBtn.textContent = '已傳送';
        doneBtn.onclick = function () { setManualReminderStatusUI(it, '已傳送'); };
        ops.appendChild(doneBtn);
      } else {
        const restoreBtn = document.createElement('button');
        restoreBtn.type = 'button';
        restoreBtn.className = 'btn btn-xs';
        restoreBtn.textContent = '恢復';
        restoreBtn.onclick = function () { setManualReminderStatusUI(it, '待提醒'); };
        ops.appendChild(restoreBtn);
      }

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'btn btn-danger btn-xs';
      removeBtn.textContent = '移除';
      removeBtn.onclick = function () { deleteManualStageDirectlyUI(it); };
      ops.appendChild(removeBtn);

      head.appendChild(ops);
      card.appendChild(head);

      const meta = document.createElement('div');
      meta.className = 'hint';
      meta.style.marginTop = '5px';
      meta.innerHTML =
        '階段：' + escapeHtml(it.stageName) +
        (it.baseDate ? (' ｜ 基準日：' + escapeHtml(it.baseDate)) : '') +
        (it.deadlineDate && it.deadlineDate !== it.baseDate ? (' ｜ 截止日：<strong style="color:var(--err-text);">' + escapeHtml(it.deadlineDate) + '</strong>') : '');
      card.appendChild(meta);

      const box = document.createElement('div');
      box.className = 'msg-bubble';
      box.style.marginTop = '7px';
      const ta = document.createElement('textarea');
      ta.className = 'msg-edit-area';
      ta.value = it.copyText || '';
      ta.rows = Math.min(9, Math.max(3, (it.copyText || '').split('\n').length + 1));
      ta.onfocus = function () { state.lastFocusedTextarea = ta; };
      box.appendChild(ta);
      card.appendChild(box);

      copyMsgBtn.onclick = function () {
        copyTextValue(ta.value, '已複製訊息，可直接貼回官方 LINE');
      };

      wrap.appendChild(card);
    });
  }

  function onMcSourceRowSelect() {
    const key = document.getElementById('mcSourceSelect').value;
    const noticeEl = document.getElementById('mcSourceMissingNotice');
    const nameEl = document.getElementById('mcApplicantName');
    nameEl.classList.remove('input-missing');

    if (!key) {
      document.getElementById('mcSourceSheetName').value = '';
      document.getElementById('mcSourceRowIndex').value = '';
      noticeEl.classList.add('hidden');
      return;
    }

    const found = (state.manualSourceRows || []).find(function (r) { return r.sourceKey === key; });
    if (!found) return;

    document.getElementById('mcSourceSheetName').value = found.sheetName;
    document.getElementById('mcSourceRowIndex').value = found.rowIndex;

    if (found.liffGroup) document.getElementById('mcGroup').value = found.liffGroup;
    onMcGroupChange();

    if (found.applyType) {
      const typeSel = document.getElementById('mcApplyType');
      const hasOpt = Array.from(typeSel.options).some(function (o) { return o.value === found.applyType; });
      if (hasOpt) {
        typeSel.value = found.applyType;
        onMcApplyTypeChange();
      }
    }

    nameEl.value = found.applicantName || '';
    if (!found.applicantName) nameEl.classList.add('input-missing');
    document.getElementById('mcCaseNote').value = found.caseNote || '';
    document.getElementById('mcIsFullTimeChk').checked = !!found.isFullTime;

    const dates = found.dates || {};
    let filledCount = 0;
    document.querySelectorAll('.mc-date-inp').forEach(function (inp) {
      const dk = inp.getAttribute('data-key');
      const val = dates[dk] || '';
      inp.value = val;
      if (val) {
        filledCount++;
        inp.classList.remove('input-missing');
      } else if (inp.getAttribute('data-optional') !== 'true') {
        inp.classList.add('input-missing');
      }
    });

    if (found.missingHints && found.missingHints.length) {
      noticeEl.textContent = '已帶入既有欄位，請補填標黃缺漏項目：' + found.missingHints.join('、') + '。';
      noticeEl.classList.remove('hidden');
    } else {
      noticeEl.classList.add('hidden');
    }

    if (filledCount > 0) {
      previewManualCreateStages();
    }
  }

  function onMcApplyTypeChange() {
    const typeVal = document.getElementById('mcApplyType').value;
    const found = (state.businessTypes || []).find(function (t) { return t.applyType === typeVal; });
    const dateWrap = document.getElementById('mcDateFieldsWrap');
    const offPanel = document.getElementById('mcOfficialPanel');
    const semWrap = document.getElementById('mcSemesterWrap');
    const ftWrap = document.getElementById('mcFullTimeWrap');

    dateWrap.innerHTML = '';
    offPanel.classList.add('hidden');
    offPanel.removeAttribute('open');
    semWrap.classList.add('hidden');
    ftWrap.classList.add('hidden');
    state.mcDraftStages = [];
    document.getElementById('mcStagesPreviewWrap').classList.add('hidden');

    if (!found) return;

    if (found.noteExample) {
      document.getElementById('mcCaseNote').placeholder = found.noteExample;
    }

    const matchingSch = (state.reminderOfficialSchedules || []).filter(function (s) {
      return s.status !== '停用' && s.applyType === typeVal;
    });
    if (matchingSch.length > 0) {
      const offSel = document.getElementById('mcOfficialSelect');
      offSel.innerHTML = '<option value="">-- 自行輸入日期 --</option>';
      matchingSch.forEach(function (s) {
        const opt = document.createElement('option');
        opt.value = s.scheduleId;
        opt.textContent = s.name + (s.startDate ? ('｜' + s.startDate) : '');
        offSel.appendChild(opt);
      });
      document.getElementById('mcOfficialTitle').textContent = '官方期程快速帶入（選填｜' + matchingSch.length + ' 筆）';
      offPanel.classList.remove('hidden');
    }

    if (typeVal.indexOf('正式學籍') !== -1) {
      document.getElementById('mcSemesterSelect').value = '';
      semWrap.classList.remove('hidden');
    }

      const el = document.getElementById('mcDate_' + k);
      if (el && /^\d{4}-\d{2}-\d{2}$/.test(String(val || ''))) {
        el.value = val;
        el.classList.remove('input-missing');
      }
    };
    setDate('regStart', found.regStart);
    setDate('regEnd', found.regEnd);
    setDate('startDate', found.startDate);

      document.getElementById('mcCaseNote').value = found.name;

  function onMcSemesterSelect() {
    const val = document.getElementById('mcSemesterSelect').value;
    if (!val || val.indexOf('|') === -1) return;
    const p = val.split('|');
    const sEl = document.getElementById('mcDate_subsidyStart');
    const eEl = document.getElementById('mcDate_subsidyEnd');
    if (sEl) { sEl.value = p[0]; sEl.classList.remove('input-missing'); }

  function collectMcDates() {
    const dates = {};
    document.querySelectorAll('.mc-date-inp').forEach(function (inp) {
      const k = inp.getAttribute('data-key');
      const v = String(inp.value || '').trim();
      if (k && /^\d{4}-\d{2}-\d{2}$/.test(v)) dates[k] = v;
    });
    return dates;
  }

  function debouncedMcPreview() {
    document.getElementById('mcApplicantName').classList.remove('input-missing');
    clearTimeout(state.mcPreviewTimer);
    state.mcPreviewTimer = setTimeout(function () {
      const dates = collectMcDates();
      if (Object.keys(dates).length > 0 && document.getElementById('mcApplyType').value) {
        previewManualCreateStages();
      }
    }, 350);
  }

  function previewManualCreateStages() {
    const applyType = document.getElementById('mcApplyType').value;
    const dates = collectMcDates();
    if (!applyType) { showToast('請先選擇申請種類', 'err'); return; }
    if (!Object.keys(dates).length) { showToast('請至少填寫一個日期', 'err'); return; }

    const reqId = ++state.mcPreviewSeq;
    const wrap = document.getElementById('mcStagesPreviewWrap');
    const listEl = document.getElementById('mcStagesPreviewList');
    wrap.classList.remove('hidden');
    listEl.innerHTML = '<div class="hint">正在依國定假日表試算排程與文案...</div>';

    google.script.run
      .withSuccessHandler(function (res) {
        if (reqId !== state.mcPreviewSeq) return;
        if (res && res.authError) { doLogout(true); return; }
        if (!res || !res.ok || !res.stages || !res.stages.length) {
          state.mcDraftStages = [];
          listEl.innerHTML = '<div class="hint" style="color:var(--err-text);">目前填入的日期查無對應階段，請補填缺漏日期。</div>';
          return;
        }
        state.mcDraftStages = res.stages.map(function (st) {
          return Object.assign({ selected: !st.isPast }, st);
        });
        if (state.mcDraftStages.every(function (x) { return !x.selected; })) {
          state.mcDraftStages.forEach(function (x) { x.selected = true; });
        }
        renderMcStagesPreview();
      })
      .withFailureHandler(function (err) {
        if (reqId !== state.mcPreviewSeq) return;
        listEl.innerHTML = '<div class="hint" style="color:var(--err-text);">試算失敗：' + escapeHtml(err.message || err) + '</div>';
      })
      .apiPreviewManualReminder(state.token, {
        applyType: applyType,
        dates: dates,
        isFullTime: document.getElementById('mcIsFullTimeChk').checked,
        applicantName: (document.getElementById('mcApplicantName').value || '').trim() || '退除役官兵',
        caseNote: (document.getElementById('mcCaseNote').value || '').trim()
      });
  }

  function removeMcDraftStage(idx) {

    const listEl = document.getElementById('mcStagesPreviewList');

  function renderDaytimeList() {
    const q = (document.getElementById('daySearch').value || '').trim().toLowerCase();
    const listWrap = document.getElementById('daytimeList');
    listWrap.innerHTML = '';

    let items = state.faqs.filter(function (f) {
      if (f.status === '停用') return false;
      if (state.dayCat === 'MY_SCOPE') {
        if (!matchesOwnerFaq(f)) return false;
      } else if (state.dayCat !== 'ALL' && f.category !== state.dayCat) {
        return false;
      }
      if (state.dayOnlyPinned && !state.pinnedKeys.has(getFaqKey(f))) return false;
      if (q) {
        const hay = (f.category + ' ' + f.keywords + ' ' + f.msgs.join(' ') + ' ' + f.contact + ' ' + f.note).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    items.sort(function (a, b) {
      const pa = state.pinnedKeys.has(getFaqKey(a)) ? 1 : 0;
      const pb = state.pinnedKeys.has(getFaqKey(b)) ? 1 : 0;
      if (pa !== pb) return pb - pa;
      if (state.ownerProfile === 'CLASS2_CPAS' && state.dayCat === 'MY_SCOPE') {
        const ca = isCpasFaqItem(a) ? 1 : 0;
        const cb = isCpasFaqItem(b) ? 1 : 0;
        if (ca !== cb) return cb - ca;
      }
      const da = a.status === '僅白天' ? 1 : 0;
      const db = b.status === '僅白天' ? 1 : 0;
      if (da !== db) return db - da;
      return 0;
    });

    document.getElementById('dayCountLabel').textContent = '共 ' + items.length + ' 筆';

    if (!items.length) {
      listWrap.innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);">查無符合條件的問答。</div>';
      return;
    }

    items.forEach(function (item) {
      const key = getFaqKey(item);
      const isPinned = state.pinnedKeys.has(key);
      const card = document.createElement('div');
      card.className = 'faq-card' + (item.status === '僅白天' ? ' is-day' : '');

      const head = document.createElement('div');
      head.className = 'faq-head';
      const left = document.createElement('div');
      left.className = 'faq-head-left';

      const starBtn = document.createElement('button');
      starBtn.type = 'button';
      starBtn.className = 'star-btn' + (isPinned ? ' pinned' : '');
      starBtn.title = isPinned ? '取消釘選' : '釘選置頂';
      starBtn.textContent = isPinned ? '★' : '☆';
      starBtn.onclick = function () { togglePinItem(key); };
      left.appendChild(starBtn);

      if (item.status === '僅白天') {
        const stBadge = document.createElement('span');
        stBadge.className = 'badge badge-day';
        stBadge.textContent = '常用範本';
        left.appendChild(stBadge);
      }

      const catBadge = document.createElement('span');
      catBadge.className = 'badge badge-cat';
      catBadge.textContent = item.category;
      left.appendChild(catBadge);

      const kwEl = document.createElement('span');
      kwEl.className = 'kw-line' + (state.dayExpandAll ? '' : ' collapsed');
      kwEl.textContent = item.keywords;
      kwEl.title = '點擊展開或收合關鍵字';
      kwEl.onclick = function () { kwEl.classList.toggle('collapsed'); };
      left.appendChild(kwEl);
      head.appendChild(left);

      const right = document.createElement('div');
      right.className = 'toolbar-group';

      const validTexts = item.msgs.filter(function (m) {
        return m.trim() && !isImageUrl(m) && !isAudioUrl(m) && !isFlexTag(m);
      });
      if (validTexts.length > 0) {
        const copyAllBtn = document.createElement('button');
        copyAllBtn.type = 'button';
        copyAllBtn.className = 'btn btn-primary btn-xs';
        copyAllBtn.textContent = validTexts.length > 1 ? '複製完整文字' : '複製文字';
        copyAllBtn.onclick = function () {
          const areas = card.querySelectorAll('.msg-edit-area');
          const parts = [];
          areas.forEach(function (a) {
            const t = (a.value || '').trim();
            if (t) parts.push(t);
          });
          let out = parts.join('\n\n');
          if (item.contact) out += '\n\n聯繫電話：' + item.contact;
          copyTextValue(out, '已複製文字，可直接貼回 LINE');
        };
        right.appendChild(copyAllBtn);
      }

      head.appendChild(right);
      card.appendChild(head);

      const msgGrid = document.createElement('div');
      msgGrid.className = 'msg-grid';

      item.msgs.forEach(function (m, mIdx) {
        const raw = String(m || '').trim();
        if (!raw) return;
        const box = document.createElement('div');
        box.className = 'msg-bubble';

        if (isFlexTag(raw)) {
          box.innerHTML =
            '<div class="msg-bubble-head">' +
              '<span>職訓備案日試算互動卡片</span>' +
              '<div class="toolbar-group"></div>' +
            '</div>' +
            '<div class="flex-preview-card">' +
              '<div class="flex-preview-title">開訓前第 8 工作日自動試算卡</div>' +
              '<div class="flex-preview-desc">可複製引導語請民眾在官方 LINE 輸入「備案日試算」開啟小日曆。</div>' +
            '</div>';
          const actWrap = box.querySelector('.toolbar-group');
          const cpGuideBtn = document.createElement('button');
          cpGuideBtn.type = 'button'; cpGuideBtn.className = 'btn btn-soft btn-xs'; cpGuideBtn.textContent = '複製引導語';
          cpGuideBtn.onclick = function () { copyTextValue(FLEX_CALC_GUIDE_TEXT, '已複製試算引導語'); };
          actWrap.appendChild(cpGuideBtn);
        } else if (isImageUrl(raw)) {
          const clean = stripHash(raw);
          box.innerHTML = '<div class="msg-bubble-head"><span>圖片（訊息 ' + (mIdx + 1) + '）</span><div class="toolbar-group"></div></div>';
          const actWrap = box.querySelector('.toolbar-group');
          const cpImgBtn = document.createElement('button');
          cpImgBtn.type = 'button'; cpImgBtn.className = 'btn btn-soft btn-xs'; cpImgBtn.textContent = '複製圖片';
          cpImgBtn.onclick = function () { copyImageFromUrl(clean); };
          actWrap.appendChild(cpImgBtn);

          const cpUrlBtn = document.createElement('button');
          cpUrlBtn.type = 'button'; cpUrlBtn.className = 'btn btn-xs'; cpUrlBtn.textContent = '複製連結';
          cpUrlBtn.onclick = function () { copyTextValue(clean, '已複製圖片網址'); };
          actWrap.appendChild(cpUrlBtn);

          const img = document.createElement('img'); img.className = 'img-preview'; img.src = clean; img.alt = '圖片預覽';
          img.onclick = function () { window.open(clean, '_blank'); };
          box.appendChild(img);
        } else if (isAudioUrl(raw)) {
          const clean = stripHash(raw);
          box.innerHTML = '<div class="msg-bubble-head"><span>語音檔（訊息 ' + (mIdx + 1) + '）</span><div class="toolbar-group"></div></div>';
          const actWrap = box.querySelector('.toolbar-group');
          const cpUrlBtn = document.createElement('button');
          cpUrlBtn.type = 'button'; cpUrlBtn.className = 'btn btn-xs'; cpUrlBtn.textContent = '複製連結';
          cpUrlBtn.onclick = function () { copyTextValue(clean, '已複製語音連結'); };
          actWrap.appendChild(cpUrlBtn);

          const audio = document.createElement('audio'); audio.controls = true; audio.style.width = '100%'; audio.src = clean;
          box.appendChild(audio);
        } else {
          const bHead = document.createElement('div');
          bHead.className = 'msg-bubble-head';
          bHead.innerHTML = '<span>訊息 ' + (mIdx + 1) + '（可直接微調）</span>';
          const cpBtn = document.createElement('button');
          cpBtn.type = 'button'; cpBtn.className = 'btn btn-xs'; cpBtn.textContent = '複製此段';
          bHead.appendChild(cpBtn);
          box.appendChild(bHead);

          const ta = document.createElement('textarea');
          ta.className = 'msg-edit-area';
          ta.value = raw;
          ta.rows = Math.min(9, Math.max(2, raw.split('\n').length + 1));
          ta.onfocus = function () { state.lastFocusedTextarea = ta; };
          cpBtn.onclick = function () { copyTextValue(ta.value, '已複製訊息 ' + (mIdx + 1)); };
          box.appendChild(ta);
        }
        msgGrid.appendChild(box);
      });

      card.appendChild(msgGrid);

      if (item.contact) {
        const meta = document.createElement('div');
        meta.className = 'hint';
        meta.style.marginTop = '7px';
        meta.textContent = '聯繫電話：' + item.contact;
        card.appendChild(meta);
      }

      listWrap.appendChild(card);
    });
  }

  function renderDraftBoardList() {
    const scopeFilter = (document.getElementById('draftScopeFilter') && document.getElementById('draftScopeFilter').value) || 'MY_SCOPE';
    const q = (document.getElementById('draftSearchInput').value || '').trim().toLowerCase();
    const wrap = document.getElementById('draftBoardList');
    wrap.innerHTML = '';

    const list = (state.groupDrafts || []).filter(function (d) {
      if (scopeFilter === 'MY_SCOPE' && !matchesOwnerDraft(d)) return false;
      if (!q) return true;
      const hay = (d.sourceName + ' ' + d.maskedQuestion + ' ' + d.draftText + ' ' + d.draftSource + ' ' + d.pushStatus + ' ' + d.recipients).toLowerCase();
      return hay.indexOf(q) !== -1;
    });

    document.getElementById('draftCountLabel').textContent = '共 ' + list.length + ' 筆';

    if (!list.length) {
      wrap.innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);">目前尚無符合條件的草稿紀錄。</div>';
      return;
    }

    list.forEach(function (d) {
      const card = document.createElement('div');
      card.className = 'faq-card is-draft';

      const head = document.createElement('div');
      head.className = 'faq-head';
      head.innerHTML =
        '<div class="faq-head-left">' +
          '<span class="badge badge-dark">' + escapeHtml(d.time) + '</span>' +
          '<span class="badge badge-cat">' + escapeHtml(d.sourceName) + '</span>' +
          '<span class="badge badge-cyan">' + escapeHtml(d.draftSource) + '</span>' +
        '</div>';

      const cpBtn = document.createElement('button');
      cpBtn.type = 'button'; cpBtn.className = 'btn btn-primary btn-sm'; cpBtn.textContent = '複製回覆';
      head.appendChild(cpBtn);
      card.appendChild(head);

      const qBox = document.createElement('div');
      qBox.className = 'draft-q-box';
      qBox.textContent = '提問：' + d.maskedQuestion;
      card.appendChild(qBox);

      const taWrap = document.createElement('div');
      taWrap.className = 'msg-bubble';
      taWrap.style.marginTop = '8px';
      const ta = document.createElement('textarea');
      ta.className = 'msg-edit-area';
      ta.value = d.draftText || '';
      ta.rows = Math.min(10, Math.max(3, (d.draftText || '').split('\n').length + 1));
      taWrap.appendChild(ta);
      card.appendChild(taWrap);

      cpBtn.onclick = function () { copyTextValue(ta.value, '已複製回覆，可直接貼回 LINE'); };
      wrap.appendChild(card);
    });
  }

  function handleScheduleDocFilePicked(e) {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    if (file.size > 11.5 * 1024 * 1024) { showToast('檔案超過 11.5 MB 上限', 'err'); return; }
    const reader = new FileReader();
    reader.onload = function (ev) {
      state.schDocBase64 = ev.target.result;
      state.schDocMimeType = file.type || (file.name.toLowerCase().endsWith('.pdf') ? 'application/pdf' : 'image/jpeg');
      document.getElementById('schDocFileName').textContent = file.name;
      showToast('檔案已載入', 'ok');
    };
    reader.readAsDataURL(file);
  }

  function runAiParseOfficialSchedulesUI() {
    const sourceType = document.getElementById('schModalSourceType').value;
    const targetApplyType = document.getElementById('schModalApplyType').value;
    const sourceUrl = (document.getElementById('schModalUrl').value || '').trim();
    const rawText = (document.getElementById('schModalRawText').value || '').trim();
    if (!state.schDocBase64 && !sourceUrl && !rawText) { showToast('請先上傳檔案、貼上網址或文字', 'err'); return; }

    setLoading(true, 'Gemini 解析日期中...');
    google.script.run
      .withSuccessHandler(function (res) {
        setLoading(false);
        if (res && res.authError) { doLogout(true); return; }
        if (!res || !res.ok || !res.items || !res.items.length) { showToast((res && res.message) || '未能解析出有效日期', 'err'); return; }
        state.schParsedItems = res.items;
        document.getElementById('schPreviewInfo').textContent = '已解析出 ' + res.items.length + ' 筆期程，確認後勾選匯入：';
        renderParsedSchedulesPreview();
        document.getElementById('schPreviewWrap').classList.remove('hidden');
        document.getElementById('schBatchSaveBtn').classList.remove('hidden');
      })
      .withFailureHandler(function (err) { setLoading(false); showToast('解析異常：' + (err.message || err), 'err'); })
      .apiAiParseOfficialSchedules(state.token, {

  function renderReminderTypeFilter() {
    const sel = document.getElementById('remTplTypeFilter');
    const dl = document.getElementById('rtApplyTypeList');
    if (!sel) return;
    const groupFilter = document.getElementById('remTplGroupFilter').value || 'MY_SCOPE';
    const prev = sel.value || 'ALL';

    const scoped = (state.reminderTemplates || []).filter(function (t) {
      if (groupFilter === 'MY_SCOPE') return matchesOwnerLiffGroup(t.liffGroup);
      if (groupFilter === 'ALL') return true;
      return t.liffGroup === groupFilter;
    });

    const typeSet = [];
    scoped.forEach(function (t) {
      if (t.applyType && typeSet.indexOf(t.applyType) === -1) typeSet.push(t.applyType);
    });

    sel.innerHTML = '<option value="ALL">全部申請種類（' + scoped.length + ' 階段）</option>';
    typeSet.forEach(function (tp) {
      const cnt = scoped.filter(function (t) { return t.applyType === tp; }).length;
      const opt = document.createElement('option');
      opt.value = tp; opt.textContent = tp + '（' + cnt + '）';
      sel.appendChild(opt);
    });
    sel.value = (prev === 'ALL' || typeSet.indexOf(prev) !== -1) ? prev : 'ALL';

    if (dl) {
      const allTypes = [];
      (state.reminderTemplates || []).forEach(function (t) {
        if (t.applyType && allTypes.indexOf(t.applyType) === -1) allTypes.push(t.applyType);
      });
      dl.innerHTML = '';
      allTypes.forEach(function (tp) {
        const dopt = document.createElement('option'); dopt.value = tp; dl.appendChild(dopt);
      });
    }
  }

  function updateReminderLivePreview() {
    const pv = document.getElementById('rtLivePreview');

    const titleRaw = (document.getElementById('rtCardTitle').value || '業務期程提醒').trim();
    const stageRaw = (document.getElementById('rtStageName').value || '階段').trim();
    const applyType = (document.getElementById('rtApplyType').value || '業務').trim();
    const bodyRaw = (document.getElementById('rtMessageTemplate').value || '').trim();
    const applyDemo = function (str) {
      return String(str || '')
        .replace(/\{稱呼\}|\{姓名\}|\{暱稱\}|\{LINE暱稱\}/g, '王小明')
        .replace(/\{申請種類\}|\{業務\}/g, applyType)
        .replace(/\{階段\}/g, stageRaw)
        .replace(/\{基準日\}/g, '2026-12-20')
        .replace(/\{截止日\}/g, '2026-12-08')
        .replace(/\{備註\}/g, 'OO公司－技術員');

    pv.innerHTML =
      '<div style="font-weight:700;color:var(--charcoal);">' + escapeHtml(applyDemo(titleRaw)) + '</div>' +
      '<div style="font-size:11.5px;color:var(--cyan-dark);margin-bottom:6px;">' + escapeHtml(stageRaw) + '</div>' +

  function renderReminderRecords() {
    const scopeFilter = document.getElementById('remRecScopeFilter').value || 'MY_SCOPE';
    const stFilter = document.getElementById('remRecStatusFilter').value || 'ALL';
    const q = (document.getElementById('remRecSearch').value || '').trim().toLowerCase();
    const wrap = document.getElementById('remRecordList');
    if (!wrap) return;
    const editable = canEditNow();
    wrap.innerHTML = '';

    const list = (state.reminderRecords || []).filter(function (r) {
      if (scopeFilter === 'MY_SCOPE' && !matchesOwnerApplyType(r.applyType, '')) return false;
      if (stFilter !== 'ALL' && r.status !== stFilter) return false;
      if (q) {
        const hay = (r.caseId + ' ' + r.applicantName + ' ' + r.displayName + ' ' + r.applyType + ' ' + r.caseNote + ' ' + r.stageName).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    document.getElementById('remRecCountLabel').textContent = '共 ' + list.length + ' 筆';

    if (!list.length) {
      wrap.innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);">目前尚無符合條件的自動提醒名單。</div>';
      return;
    }

    list.forEach(function (r) {
      const card = document.createElement('div');
      card.className = 'faq-card ' + (r.status === '待發送' ? 'is-manual' : (r.status === '發送失敗' ? 'is-manual-due' : 'is-off'));

      let stCls = 'badge-off';
      if (r.status === '待發送') stCls = 'badge-warn';
      else if (r.status === '已發送') stCls = 'badge-on';
      else if (r.status === '發送失敗') stCls = 'badge-err';

      const head = document.createElement('div');
      head.className = 'faq-head';
      head.innerHTML =
        '<div class="faq-head-left">' +
          '<span class="badge ' + stCls + '">' + escapeHtml(r.status) + '</span>' +
          '<span class="badge badge-cat">' + escapeHtml(r.applyType) + '</span>' +
          '<strong style="font-size:14.5px;color:var(--charcoal);">' + escapeHtml(r.applicantName || '-') + '</strong>' +
          (r.displayName ? ('<span style="font-size:12.5px;color:var(--muted);">（LINE：' + escapeHtml(r.displayName) + '）</span>') : '') +
        '</div>';

      if (editable) {
        const ops = document.createElement('div');
        ops.className = 'toolbar-group';

        const sendBtn = document.createElement('button');
        sendBtn.type = 'button'; sendBtn.className = 'btn btn-soft btn-xs';
        sendBtn.textContent = r.status === '已發送' ? '補發' : '立即發送';
        sendBtn.onclick = function () { sendSingleReminderUI(r); };
        ops.appendChild(sendBtn);

        if (r.status === '待發送' || r.status === '發送失敗') {
          const cancelBtn = document.createElement('button');
          cancelBtn.type = 'button'; cancelBtn.className = 'btn btn-danger btn-xs'; cancelBtn.textContent = '取消';
          cancelBtn.onclick = function () { updateReminderRecordStatusUI(r, '已結案取消'); };
          ops.appendChild(cancelBtn);
        } else if (r.status === '已結案取消') {
          const restoreBtn = document.createElement('button');
          restoreBtn.type = 'button'; restoreBtn.className = 'btn btn-xs'; restoreBtn.textContent = '恢復';
          restoreBtn.onclick = function () { updateReminderRecordStatusUI(r, '待發送'); };
          ops.appendChild(restoreBtn);
        }
        head.appendChild(ops);
      }
      card.appendChild(head);

      const info = document.createElement('div');
      info.className = 'hint';

        ' ｜ 通知日：' + escapeHtml(r.remindDate) + ' ' + escapeHtml(r.sendHour) + ':00' +
        '<br>基準日：' + escapeHtml(r.baseDate) +

        (r.resultNote ? ('<br>紀錄：' + escapeHtml(r.resultNote)) : '');
      card.appendChild(info);

      wrap.appendChild(card);

  function renderManageSelectors() {
    const sel = document.getElementById('mgrCatSelect');

    sel.innerHTML = '';

    if (state.ownerProfile !== 'ALL') {
      const myCnt = state.faqs.filter(function (f) { return matchesOwnerFaq(f); }).length;
      const myOpt = document.createElement('option');
      myOpt.value = 'MY_SCOPE';
      myOpt.textContent = '我的業務（' + myCnt + ' 筆）';
      sel.appendChild(myOpt);
    }

    const allOpt = document.createElement('option');
    allOpt.value = 'ALL';
    allOpt.textContent = '全部業務（' + state.faqs.length + ' 筆）';
    sel.appendChild(allOpt);

    state.categories.forEach(function (cat) {
      const cnt = state.faqs.filter(function (f) { return f.category === cat; }).length;
      const opt = document.createElement('option');
      opt.value = cat; opt.textContent = cat + '（' + cnt + '）';
      sel.appendChild(opt);
    });

    const validVals = Array.from(sel.options).map(function (o) { return o.value; });
    if (prev && validVals.indexOf(prev) !== -1) {
      sel.value = prev;
    } else {
      sel.value = state.ownerProfile === 'ALL' ? 'ALL' : 'MY_SCOPE';
    }

    const editable = canEditNow();
    document.getElementById('mgrEditButtons').classList.toggle('hidden', !editable);
    document.getElementById('mgrLockNotice').classList.toggle('hidden', editable);
  }

  function renderManageList() {
    const cat = document.getElementById('mgrCatSelect').value || 'MY_SCOPE';
    const stFilter = document.getElementById('mgrStatusFilter').value || 'ALL';
    const q = (document.getElementById('mgrSearch').value || '').trim().toLowerCase();
    const editable = canEditNow();
    const wrap = document.getElementById('manageList');
    wrap.innerHTML = '';

    const list = state.faqs.filter(function (f) {
      if (cat === 'MY_SCOPE') {
        if (!matchesOwnerFaq(f)) return false;
      } else if (cat !== 'ALL' && f.category !== cat) {
        return false;
      }
      if (stFilter !== 'ALL' && f.status !== stFilter) return false;
      if (q) {
        const hay = (f.category + ' ' + f.keywords + ' ' + f.msgs.join(' ') + ' ' + f.options + ' ' + f.note).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    if (!list.length) {
      wrap.innerHTML = '<div style="text-align:center;padding:30px;color:var(--muted);">尚無符合條件的問答。</div>';
      return;
    }

    list.forEach(function (item) {
      const card = document.createElement('div');
      card.className = 'faq-card' + (item.status === '僅白天' ? ' is-day' : (item.status === '停用' ? ' is-off' : ''));

      const head = document.createElement('div');
      head.className = 'faq-head';
      const left = document.createElement('div');
      left.className = 'faq-head-left';

      const stClass = item.status === '啟用' ? 'badge-on' : (item.status === '僅白天' ? 'badge-day' : 'badge-off');
      left.innerHTML =
        '<span class="badge ' + stClass + '">' + escapeHtml(item.status) + '</span>' +
        '<span class="badge badge-cat">' + escapeHtml(item.category) + ' #' + item.rowIndex + '</span>';

      const kwSpan = document.createElement('span');
      kwSpan.className = 'kw-line collapsed';
      kwSpan.textContent = item.keywords;
      kwSpan.onclick = function () { kwSpan.classList.toggle('collapsed'); };
      left.appendChild(kwSpan);

        right.className = 'toolbar-group';

        editBtn.type = 'button'; editBtn.className = 'btn btn-sm'; editBtn.textContent = '編輯';

        right.appendChild(editBtn);

        const delBtn = document.createElement('button');
        delBtn.type = 'button'; delBtn.className = 'btn btn-danger btn-sm'; delBtn.textContent = '刪除';
        delBtn.onclick = function () { deleteFaqUI(item); };

      previewWrap.style.marginTop = '10px';

      previewWrap.style.flexDirection = 'column';

        const t = String(m || '').trim();

        line.style.background = 'var(--surface-soft)';
        line.style.borderRadius = '8px';

          line.innerHTML = '<div class="flex-preview-title" style="margin:0;">訊息 ' + (i + 1) + '：職訓備案日小日曆試算卡</div>';

          const img = document.createElement('img'); img.className = 'img-preview'; img.src = clean;
          img.onclick = function () { window.open(clean, '_blank'); };

  function prepareImageDataUrl(file, cb) {
    const reader = new FileReader();
    reader.onload = function (ev) {
      const rawUrl = ev.target.result;
      const img = new Image();
      img.onload = function () {
        const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, maxSide = 1600;
        if (file.type === 'image/png' && file.size <= 2 * 1024 * 1024 && w <= 1800 && h <= 1800) { cb(rawUrl, null); return; }
        if (file.size <= 1.2 * 1024 * 1024 && w <= maxSide && h <= maxSide) { cb(rawUrl, null); return; }
        let tw = w, th = h;
        if (w > maxSide || h > maxSide) {
          const r = Math.min(maxSide / w, maxSide / h); tw = Math.round(w * r); th = Math.round(h * r);
        }
        const c = document.createElement('canvas'); c.width = tw; c.height = th;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, tw, th); ctx.drawImage(img, 0, 0, tw, th);
        cb(c.toDataURL('image/jpeg', 0.88), null);
      };
      img.onerror = function () { cb(null, '無法解析此圖片格式'); };
      img.src = rawUrl;
    };
    reader.onerror = function () { cb(null, '讀取本機圖片失敗'); };
    reader.readAsDataURL(file);
  }

  function handleAudioFilePicked(e) {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    if (file.size > 10 * 1024 * 1024) { showToast('語音檔超過 10 MB 上限', 'err'); return; }
    setLoading(true, '上傳語音檔中...');
    detectAudioDurationMs(file, function (durMs) {
      const reader = new FileReader();
      reader.onload = function (ev) {
        google.script.run
          .withSuccessHandler(function (res) {
            setLoading(false);
            if (res && res.authError) { doLogout(true); return; }
            if (res && res.ok && res.url) {
              if (state.pendingSlotIdx !== null) {
                const ta = document.getElementById('editMsg_' + state.pendingSlotIdx);
                if (ta) { ta.value = res.url; updateSlotPreview(state.pendingSlotIdx); }
                showToast('語音已上傳並填入', 'ok');
              } else {
                document.getElementById('mediaToolUrlInput').value = res.url;
                document.getElementById('mediaToolPreview').innerHTML = '<audio controls style="width:100%;" src="' + escapeHtml(stripHash(res.url)) + '"></audio>';
                document.getElementById('mediaToolResult').classList.remove('hidden');
                showToast('語音上傳成功', 'ok');
              }
            } else showToast((res && res.message) || '上傳失敗', 'err');
          })
          .withFailureHandler(function (err) { setLoading(false); showToast('上傳異常：' + (err.message || err), 'err'); })
          .apiUploadAudioToGithub(state.token, ev.target.result, file.name, durMs);
      };
      reader.readAsDataURL(file);
    });
  }

  function detectAudioDurationMs(file, cb) {
    try {
      const url = URL.createObjectURL(file);
      const audio = document.createElement('audio'); audio.preload = 'metadata';
      audio.onloadedmetadata = function () { URL.revokeObjectURL(url); cb(Math.round((isFinite(audio.duration) ? audio.duration : 60) * 1000)); };
      audio.onerror = function () { URL.revokeObjectURL(url); cb(60000); };
      audio.src = url;
    } catch (e) { cb(60000); }
  }

  function callSlotAiServer(slotIdx, outputMode, audioB64, audioMime) {
    const allMsgs = [];
    for (let i = 0; i < 5; i++) allMsgs.push((document.getElementById('editMsg_' + i).value || '').trim());
    const slotText = allMsgs[slotIdx];
    if (!slotText && !audioB64) { showToast('請先填入文字或音檔', 'err'); return; }

    setLoading(true, 'AI 分析中...');
    google.script.run
      .withSuccessHandler(function (res) {
        setLoading(false);
        if (res && res.authError) { doLogout(true); return; }
        if (!res || !res.ok) { showToast((res && res.message) || 'AI 分析失敗', 'err'); return; }
        if (res.mode === 'single') {
          if (res.text) { document.getElementById('editMsg_' + slotIdx).value = res.text; updateSlotPreview(slotIdx); }
          if (res.suggestedKeywords && !document.getElementById('editKeywords').value.trim()) document.getElementById('editKeywords').value = res.suggestedKeywords;
          if (res.contact && !document.getElementById('editContact').value.trim()) document.getElementById('editContact').value = res.contact;
          showToast('潤飾完成', 'ok');
        } else if (res.result) {
          const r = res.result;
          if (r.keywords && !document.getElementById('editKeywords').value.trim()) document.getElementById('editKeywords').value = r.keywords;
          if (r.contact && !document.getElementById('editContact').value.trim()) document.getElementById('editContact').value = r.contact;
          if (r.options && !document.getElementById('editOptions').value.trim()) document.getElementById('editOptions').value = r.options;
          const keepSpecial = (isAudioUrl(slotText) || isImageUrl(slotText) || isFlexTag(slotText)) ? [slotText] : [];
          const merged = (r.msgs || []).concat(keepSpecial).slice(0, 5);
          for (let i = 0; i < 5; i++) { document.getElementById('editMsg_' + i).value = merged[i] || ''; updateSlotPreview(i); }
          showToast('已自動拆解為 ' + merged.length + ' 則訊息', 'ok');
        }
      })
      .withFailureHandler(function (err) { setLoading(false); showToast('AI 異常：' + (err.message || err), 'err'); })
      .apiAiAnalyzeSlot(state.token, {
        category: document.getElementById('editCategory').value,
        slotIndex: slotIdx, slotText: slotText, outputMode: outputMode,
        existingKeywords: document.getElementById('editKeywords').value,
        allMsgs: allMsgs, audioBase64: audioB64 || '', audioMimeType: audioMime || 'audio/mp4'
      });
  }

  function openAiBatchModal() {

    if (mgrCat && mgrCat !== 'ALL' && mgrCat !== 'MY_SCOPE') sel.value = mgrCat;

  function runAiBatchAnalyze() {
    const raw = (document.getElementById('batchRawText').value || '').trim();
    if (!raw && !state.batchAudioB64) { showToast('請貼上文字或附加音檔', 'err'); return; }
    setLoading(true, 'AI 拆解問答中...');
    google.script.run
      .withSuccessHandler(function (res) {
        setLoading(false);
        if (res && res.authError) { doLogout(true); return; }
        if (!res || !res.ok || !res.items || !res.items.length) { showToast((res && res.message) || '未能拆解出問答', 'err'); return; }
        state.batchItems = res.items;
        document.getElementById('batchResultInfo').textContent = '已拆解出 ' + res.items.length + ' 筆問答，確認後勾選寫入：';
        const list = document.getElementById('batchPreviewList'); list.innerHTML = '';
        res.items.forEach(function (it, idx) {
          const div = document.createElement('div'); div.className = 'faq-card';
          div.innerHTML =
            '<label style="display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px;cursor:pointer;">' +
              '<input type="checkbox" class="batch-item-chk" data-idx="' + idx + '" checked>' +
              '<span>#' + (idx + 1) + ' ' + escapeHtml(it.keywords) + '</span>' +
            '</label>' +
            it.msgs.map(function (m, mi) {
              return '<div style="font-size:13px;background:var(--surface-soft);padding:6px 8px;border-radius:6px;margin-top:4px;white-space:pre-wrap;">訊息 ' + (mi + 1) + '：' + escapeHtml(m) + '</div>';

        document.getElementById('batchSaveBtn').classList.remove('hidden');
      })
      .withFailureHandler(function (err) { setLoading(false); showToast('拆解異常：' + (err.message || err), 'err'); })

  function renderHealthTable() {
    const sum = document.getElementById('healthSummary');
    const tbody = document.getElementById('healthTableBody');
    if (!sum || !tbody) return;
    const list = state.healthReport || [];
    const okCnt = list.filter(function (r) { return r.status === 'OK'; }).length;
    const warnCnt = list.filter(function (r) { return r.status === 'WARN'; }).length;
    const errCnt = list.filter(function (r) { return r.status === 'ERROR'; }).length;

    sum.innerHTML =
      '<div class="stat-card"><div class="stat-label">總連結數</div><div class="stat-val">' + list.length + ' 筆</div></div>' +
      '<div class="stat-card"><div class="stat-label">正常</div><div class="stat-val" style="color:var(--ok-text);">' + okCnt + ' 筆</div></div>' +
      '<div class="stat-card"><div class="stat-label">待確認</div><div class="stat-val" style="color:var(--warn-text);">' + warnCnt + ' 筆</div></div>' +
      '<div class="stat-card"><div class="stat-label">失效</div><div class="stat-val" style="color:var(--err-text);">' + errCnt + ' 筆</div></div>';

    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px;">尚未執行健檢。</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(function (r) {
      const cls = r.status === 'OK' ? 'badge-on' : (r.status === 'WARN' ? 'badge-warn' : 'badge-err');
      return '<tr><td>' + escapeHtml(r.checkedAt) + '</td><td>' + escapeHtml(r.category) + '</td><td>第 ' + r.rowIndex + ' 列 ' + escapeHtml(r.colName) + '</td>' +
        '<td><span class="badge ' + cls + '">' + escapeHtml(r.status) + '</span></td>' +
        '<td style="word-break:break-all;max-width:320px;"><a href="' + escapeHtml(r.url) + '" target="_blank">' + escapeHtml(r.url) + '</a></td><td>' + escapeHtml(r.detail) + '</td></tr>';
    }).join('');
  }

  function addHolidayRow() {
    const d = document.getElementById('newHolDate').value;
    const t = document.getElementById('newHolType').value;
    const n = document.getElementById('newHolNote').value.trim();
    if (!d) { showToast('請先選擇日期', 'err'); return; }
    state.holidays = state.holidays.filter(function (h) { return h.date !== d; });
    state.holidays.push({ date: d, type: t, note: n || (t === '放假' ? '特別放假' : '補行上班') });
    state.holidays.sort(function (a, b) { return a.date.localeCompare(b.date); });
    document.getElementById('newHolNote').value = '';
    renderHolidaysTable();
  }

  function handleIcsFilePicked(e) {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function (ev) {
      const icsText = String(ev.target.result || '');
      if (icsText.indexOf('BEGIN:VEVENT') === -1) { showToast('檔案格式不符', 'err'); return; }
      setLoading(true, '解析 .ics 檔案中...');
      google.script.run
        .withSuccessHandler(function (res) {
          setLoading(false);
          if (res && res.authError) { doLogout(true); return; }
          if (res && res.ok) { state.holidays = res.holidays || []; renderHolidaysTable(); showToast('已匯入 ' + res.count + ' 筆假日', 'ok'); }
          else showToast((res && res.message) || '匯入失敗', 'err');
        })
        .withFailureHandler(function (err) { setLoading(false); showToast('匯入異常：' + (err.message || err), 'err'); })
        .apiImportIcsHolidays(state.token, icsText);
    };
    reader.readAsText(file, 'UTF-8');
  }
